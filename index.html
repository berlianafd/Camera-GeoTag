<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Map Camera Web</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; font-family: sans-serif; touch-action: manipulation; display: flex; flex-direction: column; height: 100vh; }
        
        #top-bar { display: flex; justify-content: center; gap: 15px; padding: 15px 0; background: #000; z-index: 10; }
        .ratio-btn { background: transparent; color: gray; border: 1px solid gray; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .ratio-btn.active { background: white; color: black; border-color: white; }
        
        #view-container { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; width: 100%; }
        
        #video-wrapper { position: relative; width: 100%; background: #000; overflow: hidden; transition: aspect-ratio 0.3s; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        
        #overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: rgba(0, 0, 0, 0.5); padding: 4vw; box-sizing: border-box; 
            display: flex; gap: 3vw; color: white; text-shadow: 1px 1px 2px black; z-index: 5;
        }
        
        #map-thumb { 
            width: 15vw; max-width: 80px; height: 15vw; max-height: 80px; 
            background-color: #ddd; border: 2px solid white; border-radius: 5px; 
            margin-top: -6vw; background-image: url('https://tile.openstreetmap.org/1/0/0.png'); 
            background-size: cover; position: relative; flex-shrink: 0;
        }
        #map-pin { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-size: clamp(16px, 6vw, 24px); }
        
        #info-text { flex: 1; font-size: clamp(10px, 3vw, 13px); line-height: 1.4; word-wrap: break-word; }
        .title { font-size: clamp(14px, 4vw, 17px); font-weight: bold; margin-bottom: 5px; }
        
        #bottom-bar { background: #000; padding: 20px 5px 40px 5px; display: flex; justify-content: center; gap: 10px; z-index: 10; }
        .action-btn { 
            padding: 12px 15px; font-size: 14px; background-color: white; color: #333;
            border: none; border-radius: 30px; cursor: pointer; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(255,255,255,0.2); transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.95); }
        
        #status { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.9); color: black; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; z-index: 20; white-space: nowrap; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="top-bar">
    <button class="ratio-btn" id="btn-square" data-ratio="1">1:1</button>
    <button class="ratio-btn active" id="btn-standard" data-ratio="0.75">3:4</button>
    <button class="ratio-btn" id="btn-wide" data-ratio="0.5625">9:16</button>
</div>

<div id="status">Meminta akses kamera & lokasi...</div>

<div id="view-container">
    <div id="video-wrapper" style="aspect-ratio: 0.75;">
        <video id="video" autoplay playsinline></video>
        
        <div id="overlay">
            <div id="map-thumb"><div id="map-pin">📍</div></div>
            <div id="info-text">
                <div class="title" id="location-title">Mencari Lokasi...</div>
                <div id="address-text">Mohon tunggu, sedang mengambil data GPS.</div>
                <div id="coords-text">Lat: - Long: -</div>
                <div id="time-text">Waktu: -</div>
                <div id="note-text">Note : Captured by GPS Map Camera</div>
            </div>
        </div>
    </div>
</div>

<div id="bottom-bar">
    <button class="action-btn" id="switch-btn">🔄 Balik</button>
    <button class="action-btn" id="tag-btn">🏷️ Tag: Bawah</button>
    <button class="action-btn" id="capture-btn">📸 Foto</button>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const captureBtn = document.getElementById('capture-btn');
    const switchBtn = document.getElementById('switch-btn');
    const tagBtn = document.getElementById('tag-btn');
    const videoWrapper = document.getElementById('video-wrapper');
    const overlay = document.getElementById('overlay');
    const ratioBtns = document.querySelectorAll('.ratio-btn');

    const btnStandard = document.getElementById('btn-standard');
    const btnWide = document.getElementById('btn-wide');

    let currentData = { lat: 0, lon: 0, title: "", address: "", time: "" };
    let useFrontCamera = false;
    let currentStream = null;
    let targetRatio = 0.75; 
    let tagMode = 'bottom'; // 'bottom', 'right', 'left'

    // Logika Pemindahan Tag Manual
    tagBtn.addEventListener('click', () => {
        if (tagMode === 'bottom') {
            tagMode = 'right';
            tagBtn.innerText = "🏷️ Tag: Kanan";
        } else if (tagMode === 'right') {
            tagMode = 'left';
            tagBtn.innerText = "🏷️ Tag: Kiri";
        } else {
            tagMode = 'bottom';
            tagBtn.innerText = "🏷️ Tag: Bawah";
        }
        updateTagLayout();
    });

    function updateTagLayout() {
        const vw = videoWrapper.clientWidth;
        const vh = videoWrapper.clientHeight;
        
        if (tagMode === 'bottom') {
            overlay.style.width = '100%';
            overlay.style.bottom = '0';
            overlay.style.left = '0';
            overlay.style.top = 'auto';
            overlay.style.transform = 'none';
        } else if (tagMode === 'right') {
            overlay.style.width = vh + 'px';
            overlay.style.bottom = 'auto';
            overlay.style.left = vw + 'px';
            overlay.style.top = '0';
            overlay.style.transformOrigin = 'top left';
            overlay.style.transform = 'rotate(90deg)';
        } else if (tagMode === 'left') {
            overlay.style.width = vh + 'px';
            overlay.style.bottom = vh + 'px';
            overlay.style.left = '0';
            overlay.style.top = 'auto';
            overlay.style.transformOrigin = 'bottom left';
            overlay.style.transform = 'rotate(-90deg)';
        }
    }

    // Pantau perubahan ukuran layar agar tag tetap proporsional saat dimiringkan
    const resizeObserver = new ResizeObserver(() => updateTagLayout());
    resizeObserver.observe(videoWrapper);

    function updateOrientation() {
        const isLandscape = window.innerWidth > window.innerHeight;
        if (isLandscape) {
            btnStandard.innerText = "4:3"; btnStandard.setAttribute('data-ratio', "1.333333");
            btnWide.innerText = "16:9"; btnWide.setAttribute('data-ratio', "1.777778");
        } else {
            btnStandard.innerText = "3:4"; btnStandard.setAttribute('data-ratio', "0.75");
            btnWide.innerText = "9:16"; btnWide.setAttribute('data-ratio', "0.5625");
        }
        const activeBtn = document.querySelector('.ratio-btn.active');
        if (activeBtn) {
            targetRatio = parseFloat(activeBtn.getAttribute('data-ratio'));
            videoWrapper.style.aspectRatio = targetRatio;
        }
    }
    window.addEventListener('resize', updateOrientation);
    window.addEventListener('orientationchange', updateOrientation);
    updateOrientation();

    ratioBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            ratioBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            targetRatio = parseFloat(e.target.getAttribute('data-ratio'));
            videoWrapper.style.aspectRatio = targetRatio;
        });
    });

    function startCamera() {
        if (currentStream) currentStream.getTracks().forEach(track => track.stop());
        video.style.transform = useFrontCamera ? "scaleX(-1)" : "scaleX(1)";
        const constraints = { video: { facingMode: useFrontCamera ? "user" : "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } };
        navigator.mediaDevices.getUserMedia(constraints)
            .then(stream => {
                currentStream = stream; video.srcObject = stream;
                statusEl.innerText = "Kamera aktif. Mencari GPS...";
                if (currentData.lat === 0) getLocation();
            })
            .catch(err => { statusEl.innerText = "Akses kamera ditolak atau error."; statusEl.style.color = "red"; });
    }
    startCamera();

    switchBtn.addEventListener('click', () => { useFrontCamera = !useFrontCamera; startCamera(); });

    function getLocation() {
        if (!navigator.geolocation) { statusEl.innerText = "Browser tidak mendukung GPS."; return; }
        navigator.geolocation.getCurrentPosition(
            (position) => {
                currentData.lat = position.coords.latitude; currentData.latStr = currentData.lat.toFixed(6);
                currentData.lon = position.coords.longitude; currentData.lonStr = currentData.lon.toFixed(6);
                fetchAddress(currentData.lat, currentData.lon);
            },
            (error) => { statusEl.innerText = `GPS Error: ${error.message}`; statusEl.style.color = "red"; },
            { enableHighAccuracy: false, timeout: 15000 }
        );
    }

    function fetchAddress(lat, lon) {
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
            .then(res => res.json())
            .then(data => {
                statusEl.style.display = "none";
                let addr = data.address;
                currentData.title = `${addr.village || addr.suburb || addr.town || "Kecamatan"}, ${addr.state || "Provinsi"}, ${addr.country || "Negara"}`;
                currentData.address = data.display_name; updateOverlay();
            }).catch(err => { currentData.title = "Lokasi Tidak Dikenal"; currentData.address = "Gagal mengambil data dari internet."; updateOverlay(); });
    }

    function updateOverlay() {
        const now = new Date();
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        currentData.time = `${days[now.getDay()]}, ${now.toLocaleDateString('id-ID')} ${now.toLocaleTimeString('en-US', { hour12: false })} GMT +07:00`;
        document.getElementById('location-title').innerText = currentData.title;
        document.getElementById('address-text').innerText = currentData.address;
        document.getElementById('coords-text').innerText = `Lat ${currentData.latStr}° Long ${currentData.lonStr}°`;
        document.getElementById('time-text').innerText = currentData.time;
    }
    setInterval(updateOverlay, 1000);

    // Fungsi Render Teks Geotag di atas Kanvas
    function drawWatermark(ctx, cw, ch, scaleRef) {
        const boxHeight = scaleRef * 0.22;
        const uiStartY = ch - boxHeight;
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; ctx.fillRect(0, uiStartY, cw, boxHeight);

        ctx.fillStyle = "white"; ctx.shadowColor = "black"; ctx.shadowBlur = 4;
        const paddingLeft = cw * 0.25; 
        
        ctx.font = `bold ${scaleRef * 0.030}px sans-serif`;
        ctx.fillText(currentData.title, paddingLeft, uiStartY + (boxHeight * 0.25));

        ctx.font = `${scaleRef * 0.018}px sans-serif`;
        let textY = uiStartY + (boxHeight * 0.45);
        const lineHeight = scaleRef * 0.025;
        
        ctx.fillText(currentData.address.substring(0, 80) + '...', paddingLeft, textY);
        ctx.fillText(`Lat ${currentData.latStr}° Long ${currentData.lonStr}°`, paddingLeft, textY + lineHeight);
        ctx.fillText(currentData.time, paddingLeft, textY + (lineHeight * 2));
        ctx.fillText("Note : Captured by GPS Map Camera", paddingLeft, textY + (lineHeight * 3));

        const mapSize = Math.min(cw, ch) * 0.15;
        const mapY = uiStartY - (mapSize * 0.3);
        ctx.fillStyle = "#ddd"; ctx.fillRect(cw * 0.05, mapY, mapSize, mapSize);
        ctx.strokeStyle = "white"; ctx.lineWidth = 4; ctx.strokeRect(cw * 0.05, mapY, mapSize, mapSize);
        ctx.fillStyle = "red"; ctx.font = `bold ${mapSize * 0.4}px sans-serif`;
        ctx.fillText("📍", cw * 0.05 + (mapSize * 0.25), mapY + (mapSize * 0.65));
    }

    captureBtn.addEventListener('click', () => {
        const videoRatio = video.videoWidth / video.videoHeight;
        let cropWidth, cropHeight, startX = 0, startY = 0;

        if (videoRatio > targetRatio) {
            cropHeight = video.videoHeight; cropWidth = cropHeight * targetRatio;
            startX = (video.videoWidth - cropWidth) / 2;
        } else {
            cropWidth = video.videoWidth; cropHeight = cropWidth / targetRatio;
            startY = (video.videoHeight - cropHeight) / 2;
        }

        canvas.width = cropWidth; canvas.height = cropHeight;
        
        ctx.save();
        if (useFrontCamera) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
        ctx.drawImage(video, startX, startY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        const isLandscape = canvas.width > canvas.height;
        const scaleRef = isLandscape ? canvas.height * 1.5 : canvas.height; 

        // Terapkan rotasi tag sesuai mode yang dipilih pengguna
        if (tagMode === 'bottom') {
            drawWatermark(ctx, canvas.width, canvas.height, scaleRef);
        } else if (tagMode === 'right') {
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.rotate(90 * Math.PI / 180);
            drawWatermark(ctx, canvas.height, canvas.width, scaleRef);
            ctx.restore();
        } else if (tagMode === 'left') {
            ctx.save();
            ctx.translate(0, canvas.height);
            ctx.rotate(-90 * Math.PI / 180);
            drawWatermark(ctx, canvas.height, canvas.width, scaleRef);
            ctx.restore();
        }

        const link = document.createElement('a');
        link.download = `Geotag_${Date.now()}.jpg`; link.href = canvas.toDataURL('image/jpeg', 1.0); link.click();
    });
</script>
</body>
</html>
